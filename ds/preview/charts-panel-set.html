<!doctype html>
<!-- @dsCard group="Charts" name="Chart panels" subtitle="Grey panel, title inside, labels printed on the data, no borders" viewport="820x300" -->
<html><head><meta charset="utf-8"><title>Chart panels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:820px; }
  .row { display:flex; gap:14px; }
  .panel { background:#E4EAEA; padding:14px 16px 16px; flex:1; }
  .pt { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#0A1B3D; text-align:center; }
  .pu { font-size:10px; color:#7E8A9C; text-align:center; margin-top:1px; }
  .big { font-size:44px; font-weight:600; color:#C08878; text-align:center; margin:26px 0 4px; font-variant-numeric:tabular-nums; }
  .bl { font-size:11px; color:#0A1B3D; text-align:center; line-height:1.3; }
  svg { display:block; margin:10px auto 0; }
  .lg { display:flex; gap:16px; justify-content:center; font-size:10px; color:#1A1F28; margin-top:8px; }
  .sw { display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:5px; }
</style></head>
<body>
  <div class="row">

    <div class="panel" style="flex:0 0 190px">
      <div class="pt">Active share</div>
      <div class="big">84.2%</div>
      <div class="bl">of the portfolio differs<br>from the benchmark</div>
    </div>

    <div class="panel">
      <div class="pt">Allocation by sector</div>
      <div class="pu">% of net assets</div>
      <svg width="180" height="130" viewBox="0 0 180 130">
        <circle cx="90" cy="66" r="46" fill="none" stroke="#0A1B3D" stroke-width="26"
                stroke-dasharray="204 85" transform="rotate(-90 90 66)"/>
        <circle cx="90" cy="66" r="46" fill="none" stroke="#C08878" stroke-width="26"
                stroke-dasharray="60 229" transform="rotate(161 90 66)"/>
        <circle cx="90" cy="66" r="46" fill="none" stroke="#4F86B0" stroke-width="26"
                stroke-dasharray="25 264" transform="rotate(236 90 66)"/>
      </svg>
      <div class="lg">
        <span><span class="sw" style="background:#0A1B3D"></span>Technology 70.6%</span>
        <span><span class="sw" style="background:#C08878"></span>Health 20.8%</span>
        <span><span class="sw" style="background:#4F86B0"></span>Other 8.6%</span>
      </div>
    </div>

    <div class="panel">
      <div class="pt">Cumulative return</div>
      <div class="pu">indexed to 100 at inception</div>
      <svg width="240" height="130" viewBox="0 0 240 130">
        <line x1="0" y1="30" x2="240" y2="30" stroke="#D4DBE0" stroke-width="1"/>
        <line x1="0" y1="60" x2="240" y2="60" stroke="#D4DBE0" stroke-width="1"/>
        <line x1="0" y1="90" x2="240" y2="90" stroke="#D4DBE0" stroke-width="1"/>
        <polyline fill="none" stroke="#7E8A9C" stroke-width="1.6" stroke-dasharray="5 3"
          points="0,112 30,104 60,96 90,88 120,74 150,68 180,56 210,48 240,40"/>
        <polyline fill="none" stroke="#0A1B3D" stroke-width="2.4"
          points="0,112 30,100 60,88 90,76 120,58 150,50 180,34 210,24 240,14"/>
      </svg>
      <div class="lg">
        <span><span class="sw" style="background:#0A1B3D"></span>Fund</span>
        <span><span class="sw" style="background:#7E8A9C"></span>S&amp;P 500</span>
      </div>
    </div>

  </div>
</body></html>
