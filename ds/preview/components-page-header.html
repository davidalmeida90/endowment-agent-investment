<!doctype html>
<!-- @dsCard group="Page furniture" name="Running header and footer" subtitle="Logo left, fund name and period right, diagonal ribbon behind, hairline close" viewport="820x360" -->
<html><head><meta charset="utf-8"><title>Running header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:820px; padding:0; }
  .page { width:820px; background:#fff; padding:22px 30px 14px; box-sizing:border-box; position:relative; overflow:hidden; }
  .ribbon { position:absolute; top:-30px; left:200px; width:230px; height:150px; transform:skewX(-22deg);
            background:linear-gradient(90deg,rgba(192,136,120,.16),rgba(192,136,120,.03)); }
  .hdr { display:flex; justify-content:space-between; align-items:flex-start; position:relative; }
  .mark { display:flex; align-items:flex-end; gap:8px; }
  .wm { font-size:30px; font-weight:300; color:#0A1B3D; letter-spacing:.01em; line-height:1; }
  .sub { font-size:9px; color:#7E8A9C; letter-spacing:.04em; margin-bottom:3px; }
  .right { text-align:right; }
  .icons { font-size:9px; color:#0A1B3D; letter-spacing:.22em; margin-bottom:8px; }
  .title { font-size:26px; font-weight:700; color:#0A1B3D; text-transform:uppercase; line-height:1.05; }
  .period { font-size:16px; font-weight:600; color:#C08878; margin-top:2px; }
  .ident { font-size:10px; color:#7E8A9C; margin-top:2px; font-variant-numeric:tabular-nums; }
  .rule { border-top:1px solid #D4DBE0; margin-top:14px; }
  .body-space { height:120px; display:flex; align-items:center; justify-content:center; color:#B8C4CE; font-size:11px; letter-spacing:.1em; }
  .ftr { border-top:1px solid #D4DBE0; padding-top:8px; display:flex; justify-content:space-between;
         font-size:11px; color:#7E8A9C; }
</style></head>
<body>
  <div class="page">
    <div class="ribbon"></div>
    <div class="hdr">
      <div class="mark">
        <div>
          <div class="wm">Coldbrook</div>
          <div class="sub">CAPITAL MANAGEMENT</div>
        </div>
      </div>
      <div class="right">
        <div class="icons">in &nbsp; X &nbsp; ▶</div>
        <div class="title">Focused Equity Fund</div>
        <div class="period">June 2026</div>
        <div class="ident">CBFIX &nbsp;·&nbsp; CUSIP 19752K104</div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="body-space">PAGE CONTENT</div>
    <div class="ftr">
      <span>Coldbrook Capital &nbsp;·&nbsp; Monthly Report &nbsp;·&nbsp; June 2026</span>
      <span>1</span>
    </div>
  </div>
</body></html>
