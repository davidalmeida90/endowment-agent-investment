<!doctype html>
<!-- @dsCard group="Charts" name="Diverging bars and underwater" subtitle="Contribution across a centred zero in navy and clay, drawdown that only goes negative" viewport="880x340" -->
<html><head><meta charset="utf-8"><title>Diverging and underwater</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:880px; }
  .row { display:flex; gap:16px; }
  .panel { background:#E4EAEA; padding:14px 16px 16px; flex:1; }
  .pt { font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#0A1B3D; text-align:center; }
  .pu { font-size:10px; color:#7E8A9C; text-align:center; margin-top:1px; margin-bottom:12px; }
  .bar { display:flex; align-items:center; font-size:11px; margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .nm2 { width:86px; text-align:right; padding-right:9px; color:#1A1F28; }
  .track { flex:1; position:relative; height:15px; }
  .zero { position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:#0A1B3D; }
  .fill { position:absolute; top:2px; height:11px; }
  .v { width:46px; padding-left:9px; color:#1A1F28; }
  .lg { display:flex; gap:18px; justify-content:center; font-size:10px; color:#1A1F28; margin-top:10px; }
  .sw { display:inline-block; width:13px; height:9px; vertical-align:middle; margin-right:5px; }
</style></head>
<body>
  <div class="row">

    <div class="panel">
      <div class="pt">Contribution to return</div>
      <div class="pu">basis points, month to date</div>
      <div class="bar"><div class="nm2">Alphabet</div><div class="track"><div class="zero"></div><div class="fill" style="left:50%;width:34%;background:#0A1B3D"></div></div><div class="v">62</div></div>
      <div class="bar"><div class="nm2">Microsoft</div><div class="track"><div class="zero"></div><div class="fill" style="left:50%;width:26%;background:#0A1B3D"></div></div><div class="v">48</div></div>
      <div class="bar"><div class="nm2">Adobe</div><div class="track"><div class="zero"></div><div class="fill" style="left:50%;width:17%;background:#0A1B3D"></div></div><div class="v">31</div></div>
      <div class="bar"><div class="nm2">Autodesk</div><div class="track"><div class="zero"></div><div class="fill" style="left:50%;width:8%;background:#0A1B3D"></div></div><div class="v">14</div></div>
      <div class="bar"><div class="nm2">Nvidia</div><div class="track"><div class="zero"></div><div class="fill" style="left:38%;width:12%;background:#C08878"></div></div><div class="v">(22)</div></div>
      <div class="bar"><div class="nm2">Estée Lauder</div><div class="track"><div class="zero"></div><div class="fill" style="left:29%;width:21%;background:#C08878"></div></div><div class="v">(38)</div></div>
      <div class="lg">
        <span><span class="sw" style="background:#0A1B3D"></span>Added to return</span>
        <span><span class="sw" style="background:#C08878"></span>Detracted</span>
      </div>
    </div>

    <div class="panel">
      <div class="pt">Drawdown</div>
      <div class="pu">peak to trough, since inception</div>
      <svg width="370" height="168" viewBox="0 0 370 168">
        <g font-family="Source Sans 3, sans-serif" font-variant-numeric="tabular-nums">
          <line x1="42" y1="10" x2="370" y2="10" stroke="#0A1B3D" stroke-width="1"/>
          <line x1="42" y1="50" x2="370" y2="50" stroke="#D4DBE0"/>
          <line x1="42" y1="90" x2="370" y2="90" stroke="#D4DBE0"/>
          <line x1="42" y1="130" x2="370" y2="130" stroke="#D4DBE0"/>
          <path d="M42,10 L68,22 L94,16 L120,46 L146,88 L172,126 L198,98 L224,60 L250,26 L276,12 L302,10 L328,36 L354,64 L370,28 L370,10 Z"
                fill="rgba(192,136,120,.35)" stroke="#C08878" stroke-width="2"/>
          <circle cx="172" cy="126" r="3.5" fill="#0A1B3D"/>
          <text x="180" y="124" font-size="10.5" font-weight="600" fill="#0A1B3D">(28.4%) Mar 2020</text>
          <g fill="#7E8A9C" font-size="9.5" text-anchor="end">
            <text x="36" y="14">0%</text><text x="36" y="54">(10%)</text>
            <text x="36" y="94">(20%)</text><text x="36" y="134">(30%)</text>
          </g>
        </g>
      </svg>
      <div class="lg"><span><span class="sw" style="background:#C08878"></span>Drawdown from prior peak</span></div>
    </div>

  </div>
</body></html>
