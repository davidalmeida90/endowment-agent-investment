<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Mark reads as moving water and as a bar chart, wordmark light weight, three lockups" viewport="820x260" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:820px; }
  .row { display:flex; gap:34px; align-items:flex-end; }
  .cell { text-align:left; }
  .wm { font-size:32px; font-weight:300; color:#0A1B3D; letter-spacing:.01em; line-height:1; }
  .sub { font-size:9px; color:#7E8A9C; letter-spacing:.05em; margin-top:3px; }
  .dark { background:#0A1B3D; padding:16px 18px; }
  .dark .wm { color:#fff; } .dark .sub { color:#B8C4CE; }
</style></head>
<body>
  <div class="row">
    <div class="cell">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <rect x="6"  y="12" width="40" height="5" fill="#0A1B3D"/>
        <rect x="12" y="23" width="28" height="5" fill="#C08878"/>
        <rect x="6"  y="34" width="34" height="5" fill="#0A1B3D"/>
      </svg>
      <div class="cap">Mark</div>
    </div>

    <div class="cell">
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="34" height="34" viewBox="0 0 52 52">
          <rect x="6"  y="12" width="40" height="5" fill="#0A1B3D"/>
          <rect x="12" y="23" width="28" height="5" fill="#C08878"/>
          <rect x="6"  y="34" width="34" height="5" fill="#0A1B3D"/>
        </svg>
        <div><div class="wm">Coldbrook</div><div class="sub">CAPITAL MANAGEMENT</div></div>
      </div>
      <div class="cap">Horizontal lockup</div>
    </div>

    <div class="cell">
      <div class="dark" style="display:flex;align-items:center;gap:12px">
        <svg width="30" height="30" viewBox="0 0 52 52">
          <rect x="6"  y="12" width="40" height="5" fill="#fff"/>
          <rect x="12" y="23" width="28" height="5" fill="#C08878"/>
          <rect x="6"  y="34" width="34" height="5" fill="#fff"/>
        </svg>
        <div><div class="wm" style="font-size:24px">Coldbrook</div></div>
      </div>
      <div class="cap">Reversed</div>
    </div>

    <div class="cell">
      <div style="display:flex;gap:10px;align-items:flex-end">
        <svg width="16" height="16" viewBox="0 0 52 52"><rect x="6" y="12" width="40" height="5" fill="#0A1B3D"/><rect x="12" y="23" width="28" height="5" fill="#C08878"/><rect x="6" y="34" width="34" height="5" fill="#0A1B3D"/></svg>
        <svg width="24" height="24" viewBox="0 0 52 52"><rect x="6" y="12" width="40" height="5" fill="#0A1B3D"/><rect x="12" y="23" width="28" height="5" fill="#C08878"/><rect x="6" y="34" width="34" height="5" fill="#0A1B3D"/></svg>
        <svg width="52" height="52" viewBox="0 0 52 52"><rect x="6" y="12" width="40" height="5" fill="#0A1B3D"/><rect x="12" y="23" width="28" height="5" fill="#C08878"/><rect x="6" y="34" width="34" height="5" fill="#0A1B3D"/></svg>
      </div>
      <div class="cap">16px favicon, 24px header, 52px full</div>
    </div>
  </div>
</body></html>
