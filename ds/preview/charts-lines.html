<!doctype html>
<!-- @dsCard group="Charts" name="Line family" subtitle="Values printed on the marks, dashed reference line, dual axis with a volume band" viewport="880x560" -->
<html><head><meta charset="utf-8"><title>Line family</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:880px; }
  .pt { font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#0A1B3D; text-align:center; margin:0 0 2px; }
  .pu { font-size:10px; color:#7E8A9C; text-align:center; margin-bottom:8px; }
  .lg { display:flex; gap:20px; justify-content:center; font-size:10px; color:#1A1F28; margin:8px 0 22px; }
  .sw { display:inline-block; width:16px; height:2px; vertical-align:middle; margin-right:6px; }
  .swd { display:inline-block; width:16px; border-top:2px dashed #A8935F; vertical-align:middle; margin-right:6px; }
  .swb { display:inline-block; width:14px; height:9px; background:#D4DBE0; vertical-align:middle; margin-right:6px; }
</style></head>
<body>

  <div class="pt">Rolling twelve month excess return</div>
  <div class="pu">fund minus benchmark, %, with the long run average as reference</div>
  <svg width="880" height="200" viewBox="0 0 880 200">
    <g font-family="Source Sans 3, sans-serif" font-variant-numeric="tabular-nums">
      <line x1="0" y1="40" x2="880" y2="40" stroke="#D4DBE0"/>
      <line x1="0" y1="80" x2="880" y2="80" stroke="#D4DBE0"/>
      <line x1="0" y1="120" x2="880" y2="120" stroke="#D4DBE0"/>
      <line x1="0" y1="160" x2="880" y2="160" stroke="#D4DBE0"/>
      <line x1="0" y1="62" x2="880" y2="62" stroke="#A8935F" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="4"   y="56" font-size="11" font-weight="600" fill="#A8935F">1.8%</text>
      <text x="846" y="56" font-size="11" font-weight="600" fill="#A8935F">1.8%</text>

      <polyline fill="none" stroke="#0A1B3D" stroke-width="2.2"
        points="60,132 145,124 230,118 315,96 400,88 485,104 570,74 655,66 740,84 825,50"/>
      <g fill="#0A1B3D">
        <circle cx="60" cy="132" r="3.5"/><circle cx="145" cy="124" r="3.5"/><circle cx="230" cy="118" r="3.5"/>
        <circle cx="315" cy="96" r="3.5"/><circle cx="400" cy="88" r="3.5"/><circle cx="485" cy="104" r="3.5"/>
        <circle cx="570" cy="74" r="3.5"/><circle cx="655" cy="66" r="3.5"/><circle cx="740" cy="84" r="3.5"/>
        <circle cx="825" cy="50" r="3.5"/>
      </g>
      <g fill="#0A1B3D" font-size="11.5" font-weight="600" text-anchor="middle">
        <text x="60" y="150">0.4</text><text x="145" y="142">0.7</text><text x="230" y="136">0.9</text>
        <text x="315" y="88">1.6</text><text x="400" y="80">1.9</text><text x="485" y="122">1.4</text>
        <text x="570" y="66">2.4</text><text x="655" y="58">2.7</text><text x="740" y="102">2.0</text>
        <text x="825" y="42">3.1</text>
      </g>

      <polyline fill="none" stroke="#C08878" stroke-width="2.2"
        points="60,142 145,138 230,134 315,120 400,116 485,126 570,110 655,102 740,114 825,92"/>
      <g fill="#C08878">
        <circle cx="60" cy="142" r="3.5"/><circle cx="145" cy="138" r="3.5"/><circle cx="230" cy="134" r="3.5"/>
        <circle cx="315" cy="120" r="3.5"/><circle cx="400" cy="116" r="3.5"/><circle cx="485" cy="126" r="3.5"/>
        <circle cx="570" cy="110" r="3.5"/><circle cx="655" cy="102" r="3.5"/><circle cx="740" cy="114" r="3.5"/>
        <circle cx="825" cy="92" r="3.5"/>
      </g>

      <g fill="#7E8A9C" font-size="9.5" text-anchor="middle">
        <text x="60" y="192">Sep 25</text><text x="145" y="192">Oct 25</text><text x="230" y="192">Nov 25</text>
        <text x="315" y="192">Dec 25</text><text x="400" y="192">Jan 26</text><text x="485" y="192">Feb 26</text>
        <text x="570" y="192">Mar 26</text><text x="655" y="192">Apr 26</text><text x="740" y="192">May 26</text>
        <text x="825" y="192">Jun 26</text>
      </g>
    </g>
  </svg>
  <div class="lg">
    <span><span class="sw" style="background:#0A1B3D"></span>Class I</span>
    <span><span class="sw" style="background:#C08878"></span>Class N</span>
    <span><span class="swd"></span>Since inception average</span>
  </div>

  <div class="pt">Net asset value and traded volume</div>
  <div class="pu">bars, daily volume $m, right axis · lines, share price $, left axis</div>
  <svg width="880" height="210" viewBox="0 0 880 210">
    <g font-family="Source Sans 3, sans-serif" font-variant-numeric="tabular-nums">
      <g fill="#D4DBE0">
        <rect x="30"  y="140" width="52" height="40"/><rect x="94"  y="128" width="52" height="52"/>
        <rect x="158" y="146" width="52" height="34"/><rect x="222" y="118" width="52" height="62"/>
        <rect x="286" y="134" width="52" height="46"/><rect x="350" y="110" width="52" height="70"/>
        <rect x="414" y="142" width="52" height="38"/><rect x="478" y="124" width="52" height="56"/>
        <rect x="542" y="150" width="52" height="30"/><rect x="606" y="116" width="52" height="64"/>
        <rect x="670" y="138" width="52" height="42"/><rect x="734" y="104" width="52" height="76"/>
        <rect x="798" y="130" width="52" height="50"/>
      </g>
      <polyline fill="none" stroke="#0A1B3D" stroke-width="2"
        points="56,86 120,78 184,90 248,62 312,70 376,48 440,58 504,40 568,52 632,30 696,42 760,22 824,16"/>
      <polyline fill="none" stroke="#C08878" stroke-width="2"
        points="56,94 120,88 184,98 248,74 312,80 376,60 440,68 504,54 568,64 632,44 696,54 760,36 824,30"/>
      <line x1="0" y1="180" x2="880" y2="180" stroke="#0A1B3D" stroke-width="1"/>
      <g fill="#7E8A9C" font-size="9.5" text-anchor="middle">
        <text x="56" y="198">Jun 25</text><text x="184" y="198">Aug 25</text><text x="312" y="198">Oct 25</text>
        <text x="440" y="198">Dec 25</text><text x="568" y="198">Feb 26</text><text x="696" y="198">Apr 26</text>
        <text x="824" y="198">Jun 26</text>
      </g>
    </g>
  </svg>
  <div class="lg">
    <span><span class="swb"></span>Daily volume</span>
    <span><span class="sw" style="background:#0A1B3D"></span>Net asset value</span>
    <span><span class="sw" style="background:#C08878"></span>Market price</span>
  </div>

</body></html>
